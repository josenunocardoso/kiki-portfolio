services:
  mongo:
    image: mongo:7
    container_name: kiki-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

  frontend:
    build: ./frontend
    container_name: kiki-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - mongo

  # backend:
